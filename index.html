<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8">
<title>プロセカ ポ調</title>
<style>
body{font-family:sans-serif;max-width:900px;margin:40px auto;padding:0 20px;line-height:1.6}
.box{background:#f7f7f7;border:1px solid #ddd;border-radius:8px;padding:12px;margin:18px 0}
table{border-collapse:collapse;width:100%;margin-top:12px}
th,td{border:1px solid #ccc;padding:8px;text-align:center}
th{background:#f2f2f2}.small{max-width:340px}.note{font-size:.9em;color:#777}
</style></head><body>
<h2>プロセカ ポイント調整 計算ツール（独りんぼエンヴィー）</h2>
<div class="box"><b>使い方</b><br>
ほしいポイント数を入力すると、ライボ消費数、必要なイベントボーナス、スコアが計算されます。<br>
WLのモードでは、イベントボーナスは範囲内であればどの値でも同じポイントになります。<br>
WLイベントの場合、編成のイベントボーナスの詳細から、合計ボーナスの値を確認してください。<br>


<div class="box">
<b>イベント種類</b><br>
<label><input type="radio" name="mode" value="normal" checked> 通常</label>
<label style="margin-left:16px;"><input type="radio" name="mode" value="wl"> WL</label><br><br>
<b>ほしいポイント数</b> <input id="z" type="number" onkeydown="if(event.key==='Enter') calc()"><button onclick="calc()">計算</button>
</div>
<p id="count"></p>
<table><thead><tr><th>No.</th><th>ライボ消費数</th><th>イベントボーナス</th><th>スコア</th></tr></thead><tbody id="tbody"></tbody></table>
<script>
const divisors = [5, 10, 15, 20, 25, 27, 29, 31, 33, 35];

// 順算（ゲーム内計算式の再現）による検算用関数
function calculateActualPoint(score, bonus, lifeIndex) {
  const y = Math.floor(score / 20000);
  // ② (y + 100) * (bonus + 100) / 100 の小数第1位切り捨て（整数化）
  const baseP = Math.floor((100 + y) * (100 + bonus) / 100);
  
  if (lifeIndex === 0) return baseP;
  return baseP * divisors[lifeIndex - 1];
}

function calc() {
  const P = parseInt(document.getElementById('z').value, 10);
  if (isNaN(P) || P <= 0) return;

  const mode = document.querySelector('input[name="mode"]:checked').value;
  const validResults = [];

  // ライボ0〜10（index 0〜10）を網羅
  for (let lifeIdx = 0; lifeIdx <= divisors.length; lifeIdx++) {
    const mult = lifeIdx === 0 ? 1 : divisors[lifeIdx - 1];
    if (P % mult !== 0) continue; // 割り切れないライボ数はスキップ

    const targetBaseP = P / mult;

    // スコア区分 y (0 ～ 199)
    for (let y = 0; y <= 199; y++) {
      // 基礎P = floor((100 + y) * (100 + bonus) / 100) = targetBaseP となるボーナス範囲
      // targetBaseP <= (100 + y) * (100 + bonus) / 100 < targetBaseP + 1
      let minB = (targetBaseP * 100 / (100 + y)) - 100;
      let maxB = ((targetBaseP + 1) * 100 / (100 + y)) - 100 - 1e-9;

      if (mode === "normal") {
        minB = Math.max(0, Math.ceil(minB - 1e-9));
        maxB = Math.min(435, Math.floor(maxB + 1e-9));
        if (minB > maxB) continue;

        // 【検算】最小・最大値で実際に目標Pになるかテスト
        const testScore = y * 20000;
        if (calculateActualPoint(testScore, minB, lifeIdx) === P &&
            calculateActualPoint(testScore, maxB, lifeIdx) === P) {
          
          const disp = (minB === maxB) ? `${minB}%` : `${minB}% ～ ${maxB}%`;
          validResults.push({
            life: lifeIdx,
            bonus: disp,
            score: `${(y * 20000).toLocaleString()} ～ ${(((y + 1) * 20000) - 1).toLocaleString()}`
          });
        }
} else { // WLモード (0.1%刻み)
  minB = Math.max(0, Math.ceil((minB - 1e-9) * 10) / 10);
  maxB = Math.min(990, Math.floor((maxB + 1e-9) * 10) / 10);
  if (minB > maxB) continue;

  // 【検算】WLモードの最小値・最大値の両方で目標Pになるかテスト
  const testScore = y * 20000;
  if (calculateActualPoint(testScore, minB, lifeIdx) === P &&
      calculateActualPoint(testScore, maxB, lifeIdx) === P) {
    
    validResults.push({
      life: lifeIdx,
      bonus: `${minB.toFixed(1)}% ～ ${maxB.toFixed(1)}%`,
      score: `${(y * 20000).toLocaleString()} ～ ${(((y + 1) * 20000) - 1).toLocaleString()}`
    });
  }
}
    }
  }

  // 表示処理（最大・最小ライボの絞り込みなど）
  if (validResults.length === 0) {
    document.getElementById('tbody').innerHTML = '<tr><td colspan="4">該当なし</td></tr>';
    document.getElementById('count').textContent = '条件を満たす組：0件';
    return;
  }

  const lifes = [...new Set(validResults.map(r => r.life))].sort((a, b) => a - b);
  const minLife = lifes[0];
  const maxLife = lifes[lifes.length - 1];

  let displayRows = validResults.filter(r => r.life === maxLife);
  if (minLife !== maxLife) {
    displayRows = displayRows.concat(validResults.filter(r => r.life === minLife));
  }

  let html = '';
  displayRows.forEach((r, i) => {
    html += `<tr><td>${i + 1}</td><td>${r.life}</td><td>${r.bonus}</td><td>${r.score}</td></tr>`;
  });

  document.getElementById('tbody').innerHTML = html;
  document.getElementById('count').textContent = `条件を満たす組：${displayRows.length}件`;
}
</script></body></html>
